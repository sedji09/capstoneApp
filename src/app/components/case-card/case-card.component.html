<ion-card class="case-card">

  <!-- @if Directive: Emergency Condition -->
  @if (caseData.isEmergency) {
    <div class="emergency-badge">
      <ion-icon name="warning-outline"></ion-icon>
      <span>EMERGENCY / STAT CASE</span>
    </div>
  }

  <ion-card-header>
    <!-- Interpolation {{ }} and Property Binding [color] -->
    <div class="header-row">
      <div>
        <ion-card-title>{{ caseData.patientName }}</ion-card-title>
        <ion-card-subtitle>{{ caseData.caseNumber }} &bull; {{ caseData.modality }}</ion-card-subtitle>
      </div>
      <ion-badge [color]="getStatusColor(caseData.status)">
        {{ caseData.status }}
      </ion-badge>
    </div>
  </ion-card-header>

  <ion-card-content>
    <!-- Interpolation {{ }} -->
    <p class="case-date">Date: {{ caseData.date }}</p>

    <!-- @if Directive: Show findings if present -->
    @if (caseData.findings) {
      <p class="case-findings"><strong>Findings:</strong> {{ caseData.findings }}</p>
    }

    <!-- @if Directive: Show buttons for radiologist view -->
    @if (showActions) {
      <div class="button-group">
        <!-- Event Binding (click) -->
        <ion-button size="small" fill="outline" (click)="onViewDetails()">
          <ion-icon slot="start" name="eye-outline"></ion-icon>
          View Details
        </ion-button>

        <!-- Event Binding (click) -->
        <ion-button size="small" color="danger" (click)="onUpdateStatus()">
          <ion-icon slot="start" name="create-outline"></ion-icon>
          Update Status
        </ion-button>
      </div>
    }
  </ion-card-content>
</ion-card>
