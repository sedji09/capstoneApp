<ion-header class="ion-no-border">
  <ion-toolbar>
    <div style="display: flex; align-items: center; gap: 12px; padding: 8px 12px;">
      <img src="../assets/image/citilife-logo.png" alt="Citilife Logo" style="width: 42px; height: 42px; object-fit: contain;" />
      <span style="font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.5px;">Citilife Portal</span>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div style="display: flex; flex-direction: column; gap: 20px; margin-top: 20px;">
    
    <ion-card style="margin: 0;">
      <div style="display: flex; flex-direction: column;">
        <ion-card-header>
          <ion-card-subtitle>This is the patient portal</ion-card-subtitle>
          <ion-card-title>Patient Portal</ion-card-title>
        </ion-card-header>
        <div class="ion-padding" style="padding-top: 0;">
          <ion-button routerLink="/login" [queryParams]="{ type: 'patient' }" expand="block" color="danger" routerDirection="forward">
            Login as Patient
          </ion-button>
        </div>
      </div>
    </ion-card>

    <ion-card style="margin: 0;">
      <div style="display: flex; flex-direction: column;">
        <ion-card-header>
          <ion-card-subtitle>This is the radtech portal</ion-card-subtitle>
          <ion-card-title>RadTech Portal</ion-card-title>
        </ion-card-header>
        <div class="ion-padding" style="padding-top: 0;">
          <ion-button routerLink="/login" [queryParams]="{ type: 'radtech' }" expand="block" color="danger">
            Login as RadTech
          </ion-button>
        </div>
      </div>
    </ion-card>

  </div>
</ion-content>
