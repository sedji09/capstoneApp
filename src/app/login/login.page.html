<ion-content class="login-bg">
  <div class="login-wrapper">
    <div class="login-card">
      <!-- Header / Logo -->
      <div class="login-header">
        <div class="logo-circle">
          <img src="../assets/image/citilife-logo.png" alt="Citilife Logo" />
        </div>
        <h1 class="login-title">
          {{ loginType === 'patient' ? 'Patient Portal' : 'Staff Portal' }}
        </h1>
        <p class="login-subtitle">
          {{ loginType === 'patient' ? 'Welcome! Access your X-ray records.' : 'Welcome internal staff! Please enter
          your details.' }}
        </p>
      </div>

      <!-- Form -->
      <div class="login-form">
        <!-- Email -->
        <div class="input-group">
          <label class="input-label">Email Address</label>
          <div class="input-container">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"></path>
            </svg>
            <input type="email" class="custom-input" [(ngModel)]="userId" placeholder="Please enter your email" />
          </div>
        </div>

        <!-- Password -->
        <div class="input-group">
          <label class="input-label">Password</label>
          <div class="input-container">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input [type]="showPassword ? 'text' : 'password'" class="custom-input" [(ngModel)]="userPass"
              placeholder="••••••••" />
            <button class="eye-btn" (click)="showPassword = !showPassword">
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Error Message -->
        <div class="error-msg" *ngIf="errorMessage">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <span>{{ errorMessage }}</span>
        </div>

        <!-- Login Button -->
        <ion-button expand="block" class="login-btn" (click)="doLogin()">
          Log in
        </ion-button>

        <!-- Back to home -->
        <div class="back-link-container">
          <ion-router-link routerLink="/home" routerDirection="back" class="back-link">Back to Home</ion-router-link>
        </div>
      </div>
    </div>
  </div>
</ion-content>
