<ion-header>
  <ion-toolbar color="danger">
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container" style="display: flex; justify-content: center; margin-top: 15vh;">
    <ion-card style="width: 100%; max-width: 400px;">
      <ion-card-content>
        <h2 style="text-align: center; margin-bottom: 20px;">
          {{ loginType === 'patient' ? 'Patient Portal' : 'Radiologist Portal' }}
        </h2>

        <ion-item>
          <ion-input label="Email" labelPlacement="floating" [(ngModel)]="userId" type="text"></ion-input>
        </ion-item>

        <ion-item>
          <ion-input label="Password" labelPlacement="floating" [(ngModel)]="userPass" type="password"></ion-input>
        </ion-item>

        <!-- Error Message -->
        <ion-text color="danger" *ngIf="errorMessage">
          <p style="text-align: center;">{{ errorMessage }}</p>
        </ion-text>

        <ion-button expand="block" style="margin-top: 20px;" color="danger" (click)="doLogin()">
          Login
        </ion-button>

        <ion-button fill="clear" style="color: gray;" expand="block" routerLink="/home">
          Back to Home
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
