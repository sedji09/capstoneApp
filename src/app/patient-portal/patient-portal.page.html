<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Patient Portal</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/home">Logout</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div>
    <h2>Welcome back, {{ patients.name }}!</h2>
    <p>Here's an overview of your X-ray examination status.</p>
  </div>


  <ion-card>
    <ion-card-header>
      <div style="display: flex; align-items: center; gap: 15px;">
        <img src="{{ patients.userImg }}" alt="Profile" width="50" height="50"
          style="border-radius: 50%; object-fit: cover;" />
        <div style="display: flex; flex-direction: column; justify-content: center;">
          <ion-card-title style="margin: 0; padding-bottom: 4px;">{{ patients.name }}</ion-card-title>
          <ion-card-subtitle style="margin: 0;">{{ patients.patientId }}</ion-card-subtitle>
        </div>
      </div>
    </ion-card-header>
    <ion-card-content>
      <div
        style="display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; padding-bottom: 20px; color: #888; font-size: 0.75rem; white-space: nowrap;">
        <span style="display: flex; align-items: center; gap: 3px;">
          <ion-icon name="location-outline" style="color: #f44336; font-size: 1rem;"></ion-icon> {{ patients.location }}
        </span>
        <span style="display: flex; align-items: center; gap: 3px;">
          <ion-icon name="call-outline" style="color: #f44336; font-size: 1rem;"></ion-icon> {{ patients.contactNo }}
        </span>
        <span style="display: flex; align-items: center; gap: 3px;">
          <ion-icon name="mail-outline" style="color: #f44336; font-size: 1rem;"></ion-icon> {{ patients.email }}
        </span>
      </div>
    </ion-card-content>
  </ion-card>
</ion-content>
